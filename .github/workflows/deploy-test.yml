name: Deploy backend to test

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: backend-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployment settings
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]

      - name: Link test project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy database migrations
        run: npx --no-install supabase db push --linked --skip-vault --yes

      - name: Deploy Edge Functions
        run: npx --no-install supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
